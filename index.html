<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="巴士到站預報">
<title>巴士到站預報</title>
<!-- 引入 Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#f2f2f7;
    --card:#ffffff;
    --text-primary:#1c1c1e;
    --text-secondary:#8e8e93;
    --separator:#e5e5ea;
    --line-64k:#007aff;
    --line-73:#34c759;
    --line-73a:#ff9500;
    --red:#ff3b30;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text-primary);
    font-family:-apple-system, "SF Pro Text", system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:40px;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:18px 18px 12px;
    position:sticky; top:0; z-index:5;
    background:rgba(242,242,247,0.92);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(0,0,0,0.05);
  }
  .page-title{
    font-size:20px; font-weight:700; color:var(--text-primary);
    text-align:center;
  }
  .page-subtitle{
    font-size:16px; font-weight:600; color:var(--text-secondary);
    text-align:center; margin-top:2px;
  }
  /* 時間與更新狀態同一行排版 */
  .time-bar{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:baseline;
    margin-top:10px;
  }
  #clock{
    font-size:22px; color:var(--text-primary);
    font-variant-numeric: tabular-nums;
    font-weight:700;
    text-align:center;
  }
  .global-status{
    text-align:right;
    font-size:12px; font-weight:600; color:var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .prefix-small{font-size:13px; font-weight:600; color:var(--text-secondary);}
  .board-title{
    font-size:17px; font-weight:700; color:var(--text-primary);
    line-height:1.3; margin:18px 2px 8px;
  }
  .board-title:first-of-type{margin-top:4px;}
  .board-title-gap{margin-top:30px;}
  main{padding:14px 14px 0;}
  .card{
    background:var(--card);
    border-radius:20px;
    padding:16px 14px 14px;
    margin-bottom:14px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.06);
    position:relative;
    overflow:hidden;
  }
  .routes-row{display:flex; gap:10px;}
  .route-col{flex:1; min-width:0; display:flex; flex-direction:column; align-items:stretch; gap:0;}
  .badge{
    width:100%; box-sizing:border-box;
    font-weight:700; font-size:26px;
    color:#ffffff; background:var(--rc, #8e8e93);
    padding:6px 0; border-radius:14px 14px 0 0; letter-spacing:0.2px;
    text-align:center;
  }
  .eta-square{
    width:100%;
    display:flex;
    gap:2px;
    overflow:hidden;
  }
  .eta-primary{
    flex:1.5; min-width:0;
    background:#eef6ff;
    padding:8px 2px;
    display:flex; align-items:flex-end; justify-content:center; gap:2px;
  }
  .eta-unit-inline{font-size:11px; font-weight:600; color:var(--text-secondary); padding-bottom:4px;}
  .eta-corner-col{
    flex:1; min-width:0;
    display:flex; flex-direction:column; gap:2px;
  }
  .eta-corner{
    background:#f2f2f7;
    flex:1;
    padding:3px 6px;
    display:flex;
  }
  .eta-corner-top{align-items:center; justify-content:center;}
  .eta-corner-bottom{align-items:center; justify-content:center;}
  .eta-min{
    font-weight:700; line-height:1; color:var(--text-primary);
    font-variant-numeric:tabular-nums;
    font-size:30px;
  }
  .eta-min.compact{font-size:19px;}
  .eta-min-sm{
    font-weight:700; line-height:1; color:var(--text-primary);
    font-variant-numeric:tabular-nums;
    font-size:17px;
  }
  .eta-min-sm.compact{font-size:12px;}
  .eta-min.soon, .eta-min-sm.soon{color:var(--red);}
  .fare-row{
    margin:0;
    font-size:12.5px; color:var(--text-secondary); text-align:center;
    background:#f2f2f7;
    padding:5px 4px;
    border-radius:0 0 14px 14px;
  }
  .fare-tag{
    display:inline-block; margin-left:4px;
    background:#ffe066; color:#4d3b00;
    font-size:10.5px; font-weight:700;
    padding:1px 5px; border-radius:6px;
    vertical-align:middle;
  }

  .empty-square{
    width:100%; padding:14px 6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary); font-size:11.5px; text-align:center;
    background:#f2f2f7;
  }
  .status-block{margin-top:16px;}
  .refresh-all-btn{
    display:block; margin:14px auto 0;
    background:var(--red); color:#ffffff; border:none;
    font-weight:700; font-size:16px;
    padding:10px 26px; border-radius:24px;
    cursor:pointer;
    transition: background-color 0.2s, opacity 0.2s;
  }
  .refresh-all-btn:active{opacity:0.6;}
  .refresh-note{
    text-align:center;
    font-size:13px; color:var(--text-secondary); margin-top:8px;
  }
  .err{color:var(--red);}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.35}}
  .loading{animation:pulse 1.2s infinite;}
</style>
</head>
<body>

<header>
  <div class="page-title">巴士到站預報</div>
  <div class="page-subtitle">太和廣場 ⇄ 康樂園</div>
  <div class="time-bar">
    <div></div> <!-- 左側佔位塊（確保中間即時時間精準居中） -->
    <div id="clock">--:--:--</div>
    <div id="globalStatus" class="global-status">初始化中…</div>
  </div>
</header>

<main id="board">
  <!-- 每個方向的顯示板（標題＋卡片）由 JS 動態產生 -->
  <div class="status-block" id="statusBlock">
    <button id="refreshAllBtn" class="refresh-all-btn">即時更新</button>
    <div class="refresh-note">每45秒自動更新</div>
  </div>
</main>

<script>
(function(){

  // ---- 使用者設定：兩個方向、各三條路線 ----
  const BOARDS = [
    {
      id: "toWahMing",
      titleHTML: `太和廣場站(上車)<br><span class="dest-line"><span class="prefix-small">往</span>康樂園站</span>`,
      routes: [
        { route: "64K", stopId: "CCC4773031BC0FD8", accent: "var(--line-64k)", fare: "$6.7", segmented: true },
        { route: "73",  stopId: "9FDEEC09AD1B601B", accent: "var(--line-73)",  fare: "$7.3", segmented: false },
        { route: "73A", stopId: "9FDEEC09AD1B601B", accent: "var(--line-73a)", fare: "$7.3", segmented: false }
      ]
    },
    {
      id: "toTaiWo",
      titleHTML: `康樂園站(上車)<br><span class="dest-line"><span class="prefix-small">往</span>太和廣場站</span>`,
      routes: [
        { route: "64K", stopId: "BE5E07865E13374E", accent: "var(--line-64k)", fare: "$6.7", segmented: false },
        { route: "73",  stopId: "BE5E07865E13374E", accent: "var(--line-73)",  fare: "$7.8", segmented: false },
        { route: "73A", stopId: "BE5E07865E13374E", accent: "var(--line-73a)", fare: "$7.8", segmented: true }
      ]
    }
  ];
  const REFRESH_MS = 45000;

  const API = "https://data.etabus.gov.hk/v1/transport/kmb";
  const board = document.getElementById("board");
  const statusBlock = document.getElementById("statusBlock");
  const globalStatus = document.getElementById("globalStatus");
  const clockEl = document.getElementById("clock");

  function tickClock(){
    const d = new Date();
    clockEl.textContent = d.toLocaleTimeString("zh-HK", {hour12:false});
  }
  tickClock(); setInterval(tickClock, 1000);

  const key = (boardId, route) => `${boardId}-${route}`;

  // 為每個方向畫出標題＋一列三欄
  BOARDS.forEach((b, idx) => {
    const titleEl = document.createElement("div");
    titleEl.className = "board-title" + (idx > 0 ? " board-title-gap" : "");
    titleEl.innerHTML = b.titleHTML;
    board.insertBefore(titleEl, statusBlock);

    const card = document.createElement("div");
    card.className = "card";
    const routesRow = document.createElement("div");
    routesRow.className = "routes-row";
    card.appendChild(routesRow);
    board.insertBefore(card, statusBlock);

    b.routes.forEach(r => {
      const k = key(b.id, r.route);
      const col = document.createElement("div");
      col.className = "route-col";
      const fareContent = "車資 " + r.fare + (r.segmented ? '<span class="fare-tag">分段收費</span>' : "");

      col.innerHTML = `
        <span class="badge" style="background:${r.accent}">${r.route}</span>
        <div class="eta-square" id="eta-${k}">
          <div class="eta-primary"><span class="eta-min loading">···</span></div>
          <div class="eta-corner-col">
            <div class="eta-corner eta-corner-top"><span class="eta-min-sm loading">··</span></div>
            <div class="eta-corner eta-corner-bottom"><span class="eta-min-sm loading">··</span></div>
          </div>
        </div>
        <div class="fare-row">${fareContent}</div>
      `;
      routesRow.appendChild(col);
    });
  });

  const routeConfig = {};      // key -> {stopId, route, serviceType}

  async function getJSON(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  // 同一 stop_id 可能對應路線的不同 service_type（例如特別班／分段路線）
  // 依序嘗試 1 → 2 → 3，取第一個回傳有資料的 service_type 並記住，之後不再重試
  async function detectServiceType(route, stopId){
    for(const st of ["1", "2", "3"]){
      try{
        const j = await getJSON(`${API}/eta/${stopId}/${route}/${st}`);
        if(j.data && j.data.length) return st;
      }catch(e){ /* 試下一個 */ }
    }
    return "1"; // 全部無資料時，預設用 1，畫面會顯示「暫無班次」
  }

  async function setupRoute(k, r){
    try{
      const serviceType = await detectServiceType(r.route, r.stopId);
      routeConfig[k] = { stopId: r.stopId, route: r.route, serviceType };
      await refreshEta(k);
    }catch(e){
      const etaBox = document.getElementById("eta-" + k);
      etaBox.innerHTML = `<div class="empty-square err">讀取失敗</div>`;
    }
  }

  function minutesLabel(etaIso){
    if(!etaIso) return null;
    const diffMs = new Date(etaIso).getTime() - Date.now();
    const mins = Math.round(diffMs / 60000);
    if(mins <= 0) return { text: "到站", soon: true, arrived: true };
    return { text: String(mins), soon: mins <= 3, arrived: false };
  }

  async function refreshEta(k){
    const cfg = routeConfig[k];
    const etaBox = document.getElementById("eta-" + k);
    if(!cfg){ return; }
    try{
      const j = await getJSON(`${API}/eta/${cfg.stopId}/${cfg.route}/${cfg.serviceType}`);
      const entries = (j.data || [])
        .filter(e => e.eta)
        .sort((a,b) => new Date(a.eta) - new Date(b.eta))
        .slice(0, 3);

      if(!entries.length){
        etaBox.innerHTML = `<div class="empty-square">暫無班次</div>`;
      } else {
        const m0 = entries[0] ? minutesLabel(entries[0].eta) : null;
        const m1 = entries[1] ? minutesLabel(entries[1].eta) : null;
        const m2 = entries[2] ? minutesLabel(entries[2].eta) : null;

        const bigCompact = m0 && m0.text.length > 2 ? " compact" : "";
        const smCompact1 = m1 && m1.text.length > 2 ? " compact" : "";
        const smCompact2 = m2 && m2.text.length > 2 ? " compact" : "";
        const primaryUnit = (m0 && !m0.arrived) ? `<span class="eta-unit-inline">分鐘</span>` : "";

        etaBox.innerHTML = `
          <div class="eta-primary">
            <span class="eta-min${bigCompact} ${m0 && m0.soon ? "soon" : ""}">${m0 ? m0.text : "—"}</span>
            ${primaryUnit}
          </div>
          <div class="eta-corner-col">
            <div class="eta-corner eta-corner-top">
              <span class="eta-min-sm${smCompact1} ${m1 && m1.soon ? "soon" : ""}">${m1 ? m1.text : "—"}</span>
            </div>
            <div class="eta-corner eta-corner-bottom">
              <span class="eta-min-sm${smCompact2} ${m2 && m2.soon ? "soon" : ""}">${m2 ? m2.text : "—"}</span>
            </div>
          </div>
        `;
      }
    }catch(e){
      etaBox.innerHTML = `<div class="empty-square err">讀取失敗</div>`;
    }
  }

  const refreshAllBtn = document.getElementById("refreshAllBtn");
  const ALL_KEYS = [];
  BOARDS.forEach(b => b.routes.forEach(r => ALL_KEYS.push({ k: key(b.id, r.route), r })));

  function updateGlobalStatus(){
    const now = new Date();
    globalStatus.textContent = "更新於 " + now.toLocaleTimeString("zh-HK", {hour12:false});
  }

  async function refreshAll(){
    await Promise.all(ALL_KEYS.map(({k}) => routeConfig[k] ? refreshEta(k) : Promise.resolve()));
    updateGlobalStatus();
  }
  refreshAllBtn.addEventListener("click", refreshAll);

  async function init(){
    try{
      await Promise.all(ALL_KEYS.map(({k, r}) => setupRoute(k, r)));
      updateGlobalStatus();
      setInterval(refreshAll, REFRESH_MS);
    }catch(e){
      globalStatus.innerHTML = `<span class="err">讀取失敗</span>`;
    }
  }

  init();
})();
</script>
</body>
</html>
